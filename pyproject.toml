[project]
name = "cobolinho"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[project.scripts]
cobolinho = "cobolinho:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ty.rules]
blanket-ignore-comment = "warn"
