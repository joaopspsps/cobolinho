exclude = { glob = "cbl/**" }

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
[[repos.hooks]]
id = "ruff-check"
name = "ruff check"
entry = "uv run ruff check --force-exclude"
language = "system"
types = ["python"]
require_serial = true
[[repos.hooks]]
id = "ty-check"
name = "ty check"
entry = "uv run ty check --force-exclude"
language = "system"
types = ["python"]
require_serial = true
[[repos.hooks]]
id = "ruff-format"
name = "ruff format"
entry = "uv run ruff format --force-exclude"
language = "system"
types_or = ["python", "markdown"]
require_serial = true
